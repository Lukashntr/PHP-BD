<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Registro de notas</title>
	<link rel="stylesheet" href="registro.css">
</head>
<body>
	<main>
		<header class="intro">
			<p class="eyebrow">Secretaria escolar</p>
			<h1>Registro de notas</h1>
			<p>Preencha os dados do aluno e lance as notas das quatro avaliações.</p>
		</header>

		<form id="student-form" action="salvar.php" method="POST">
			<fieldset>
				<legend>Dados do aluno</legend>
				<div class="grid">
					<div class="student-name">
						<label for="name">Nome completo</label>
						<input type="text" id="name" name="name" placeholder="Ex.: Ana Souza" required>
					</div>
					<div>
						<label for="age">Idade</label>
						<input type="number" id="age" name="age" min="3" max="100" placeholder="Ex.: 15" required>
					</div>
					<div>
						<label for="class">Turma</label>
						<select id="class" name="class" required>
							<option value="">Selecione</option>
							<option>6º ano A</option>
							<option>7º ano A</option>
							<option>8º ano A</option>
							<option>9º ano A</option>
							<option>1º ano EM</option>
							<option>2º ano EM</option>
							<option>3º ano EM</option>
						</select>
					</div>
				</div>
			</fieldset>

			<fieldset>
				<legend>Notas das avaliações</legend>
				<div class="grid grades">
					<div>
						<label for="grade-1">1ª nota</label>
						<input class="grade" type="number" id="grade-1" name="grade-1" min="0" max="10" step="0.1" placeholder="0 a 10" required>
					</div>
					<div>
						<label for="grade-2">2ª nota</label>
						<input class="grade" type="number" id="grade-2" name="grade-2" min="0" max="10" step="0.1" placeholder="0 a 10" required>
					</div>
					<div>
						<label for="grade-3">3ª nota</label>
						<input class="grade" type="number" id="grade-3" name="grade-3" min="0" max="10" step="0.1" placeholder="0 a 10" required>
					</div>
					<div>
						<label for="grade-4">4ª nota</label>
						<input class="grade" type="number" id="grade-4" name="grade-4" min="0" max="10" step="0.1" placeholder="0 a 10" required>
					</div>
				</div>
				<div class="summary" aria-live="polite">
					<div>Média final<strong id="average">0,0</strong></div>
					<div id="status">Aguardando notas</div>
				</div>
			</fieldset>

			<div class="actions">
				<button type="reset">Limpar formulário</button>
				<button type="submit">Registrar aluno</button>
			</div>
		</form>
		<div class="actions">
			<a class="button-link" href="alunos.php">Ver alunos registrados</a>
		</div>
	</main>

	<script src="registro.js"></script>
</body>
</html>
