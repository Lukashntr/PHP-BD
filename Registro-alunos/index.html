<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de notas</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/script.js" defer></script>
</head>
<body>
    <main>
        <header id="intro">
            <h1>REGISTRO DE NOTAS</h1>
            <h3>Preencha os dados do aluno e lance as notas das quatro avaliações.</h3>
        </header>
        <section>
            <form action="cad.php" method="post">

                <div class="form-group">
                    <div class="form-item">
                        <label for="nome">Nome:</label>
                        <input type="text" id="nome" name="nome" required>
                    </div>
                    <div class="form-item">
                        <label for="idade">Idade:</label>
                        <input type="number" id="idade" name="idade" min="1" required>
                    </div>
                    <div class="form-item">
                        <label for="turma">Turma:</label>
                        <input type="text" id="turma" name="turma" required>
                    </div>
                </div>
                <div class="form-group">
                    <div class="form-item-nota">
                        <label for="nota1"><span>Nota</span><span> 1:</span></label>
                        <input type="number" class="nota" name="nota1" step="0.01" min="0" max="10" required>
                    </div>
                    <div class="form-item-nota">
                        <label for="nota2"> Nota 2: </label>
                        <input type="number" class="nota" name="nota2" min="0" max="10" required>
                    </div>
                    <div class="form-item-nota">
                        <label for="nota3">Nota 3:</label>
                        <input type="number" class="nota" name="nota3" min="0" max="10" required>
                    </div>
                    <div class="form-item-nota">
                        <label for="nota4">Nota 4:</label>
                        <input type="number" class="nota" name="nota4" min="0" max="10" required>
                    </div>
                </div>

                <div class="form-item-media">
                    <label for="media">Média:</label>
                    <label id="media" name="media" class="media">0</label>
                </div>

                <script>
                    function calcularMedia() {
                        const nota1 = parseFloat(document.querySelector('input[name="nota1"]').value) || 0;
                        const nota2 = parseFloat(document.querySelector('input[name="nota2"]').value) || 0;
                        const nota3 = parseFloat(document.querySelector('input[name="nota3"]').value) || 0;
                        const nota4 = parseFloat(document.querySelector('input[name="nota4"]').value) || 0;
                        
                        const media = (nota1 + nota2 + nota3 + nota4) / 4;
                        document.getElementById('media').textContent = media.toFixed(2);
                    }
                </script>

                <div class="form-button">
                    <button type="submit">Cadastrar Aluno</button>
                </div>

            </form>
        </section>
    </main>
</body>
</html>
