<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de notas</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <main>
        <header class="intro">
            <p class="eyebrow">Secretaria escolar</p>
            <h1>Registro de notas</h1>
            <p>Preencha os dados do aluno e lance as notas das quatro avaliações.</p>
        </header>

        <section>
            <form action="cad.php" method="post">
			<div>
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required>
			</div>
			<div>
                <label for="idade">Idade:</label>
                <input type="number" id="idade" name="idade" min="1" required>
			</div>
			<div>
                <label for="turma">Turma:</label>
                <input type="text" id="turma" name="turma" required>
			</div>
                <label for="nota1">Nota 1:</label>
                <input type="number" id="nota1" name="nota1" step="0.01" min="0" max="10" required>
			<div>
                <label for="nota2">Nota 2:</label>
                <input type="number" id="nota2" name="nota2" min="0" max="10" required>
			</div>
			<div>
                <label for="nota3">Nota 3:</label>
                <input type="number" id="nota3" name="nota3" min="0" max="10" required>
			</div>
			<div>
                <label for="nota4">Nota 4:</label>
                <input type="number" id="nota4" name="nota4" min="0" max="10" required>
			</div>
                <button type="submit">Cadastrar Aluno</button>
            </form>
        </section>
    </main>
</body>
</html>
